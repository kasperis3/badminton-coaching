# On push/PR: run tests. On push to main: deploy only if tests pass.
# Deploy secrets: SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY, SERVER_PATH
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m smoke --tb=short
      - run: pytest --tb=short --cov=mixer_core --cov=app --cov-report=term-missing

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}
            git checkout -- .
            git pull
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart baddy
